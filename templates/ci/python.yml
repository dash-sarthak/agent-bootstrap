name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy .
      - run: python -m pytest

  # Branch protection requires a context name, and matrix legs register as
  # "test (3.12)" rather than "test". Require this job instead: the name stays
  # "ci" whatever the test job grows into.
  ci:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every test leg passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test result: ${{ needs.test.result }}"
            exit 1
          fi
